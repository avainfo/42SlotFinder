<!DOCTYPE html>

<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>42 Slot Watcher</title>
	<link rel="stylesheet" href="popup.css">
</head>
<body>
<div id="popup-title">
	<h1>42 Slot Watcher</h1>
</div>
<div id="popup-content">
	<span>Watch selected slot patterns automatically.</span>
	<div id="system-status">
		<span id="status-title">SYSTEM STATUS</span>
		<div id="status-content">
			<span id="status-text-i" class="status-text-active">Idle</span>
			<span id="status-text-r">Recording slots</span>
			<span id="status-text-w">Watching pattern</span>
			<span id="status-text-s">Searching</span>
			<span id="status-text-f">Found</span>
		</div>
	</div>
	<div id="current-pattern">
		<div id="pattern-header">
			<span id="pattern-title">CURRENT PATTERN</span>
			<span id="pattern-tag">EXACT MATCH</span>
		</div>
		<div id="pattern-content">
			<span class="pattern-day">Monday</span>
			<span class="pattern-range">14:00 - 14:30</span>
			<span class="pattern-range">14:45 - 15:15</span>
		</div>
	</div>
</div>
<div id="popup-footer">
	<div id="popup-buttons">
		<button onclick="startRecording()">○ Start recording slots</button>
		<button>□ Stop recording</button>
		<button>⌕ Start searching</button>
	</div>
	<span>Made by <a href="https://github.com/avainfo">avainfo</a> : ando-sou on the 42 intra</span>
</div>
<script src="../../dist/popup/popup.js"></script>
</body>
</html>
